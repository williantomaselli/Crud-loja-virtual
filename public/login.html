<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <h1>Login</h1>
      <p>Seja bem-vindo(a) novamente!<br>Faça seu login para acessar sua conta!</p>
      <form action="/login" method="post">
        <div class="input-group">
          <label for="email">Login</label>
          <input type="email" name="email" id="email" placeholder="Insira seu email" required>
        </div>
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" name="senha" id="senha" placeholder="Insira sua senha" required minlength="5" maxlength="10">
        </div>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
